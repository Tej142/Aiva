<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AIVA — Neural Assistant HUD</title>
  <link rel="stylesheet" href="renderer.css">
  <style>
    .embedded-frame-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    iframe.aiva-hud-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #0a0e17;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="top-bar">
    <div class="brand">
      <div class="brand-icon">A</div>
      <div class="brand-title">AIVA <span style="font-size: 11px; color: #94a3b8; font-weight: 400; margin-left: 6px;">[Device Agent Connected]</span></div>
    </div>
    <div class="top-bar-controls">
      <div class="status-pill" id="status-pill-container">
        <span class="status-dot connected" id="status-dot-indicator"></span>
        <span id="nav-status-text">Connected</span>
      </div>
      <button id="btn-reconnect" class="btn" title="Reconnect WebSocket">🔄 Reconnect</button>
      <button id="btn-nav-settings" class="btn" title="Permissions & Activity Log">⚙️ Settings</button>
    </div>
  </div>

  <div class="content-area">
    <div class="embedded-frame-container">
      <iframe id="hud-iframe" class="aiva-hud-frame" allow="microphone; camera; clipboard-read; clipboard-write; display-capture"></iframe>
    </div>
  </div>

  <script src="renderer.js"></script>
  <script>
    initMainView();
  </script>
</body>
</html>
